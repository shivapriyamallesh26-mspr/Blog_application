<!DOCTYPE html>
<html>
<head>
    <title>Create Blog - My Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>My Blog</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<main>

    <div class="form-container">

        <h2>Create New Blog</h2>

        <form id="blogForm">

            <label>Blog Title</label>
            <input type="text" id="blogTitle" placeholder="Enter blog title" required>

            <label>Category</label>
            <input type="text" id="category" placeholder="Enter category" required>

            <label>Content</label>
            <textarea id="content" placeholder="Write your blog here..." required></textarea>

            <button type="submit">Publish Blog</button>

        </form>

    </div>

</main>

<footer>
    <p>© 2026 My Blog</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
